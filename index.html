<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SCARLETT III - Official</title>
<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
<style>body{font-family:'Poppins',sans-serif}</style>
</head>
<body class="bg-[#0f0f0f] text-white min-h-screen">

<nav class="fixed w-full z-40 bg-[#0f0f0f]/80 backdrop-blur-md border-b border-white/10">
  <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
    <h1 class="text-2xl font-bold text-pink-500">SCARLETT<span class="text-white"> III</span></h1>
    <div class="flex gap-2 items-center">
      <button onclick="openSettings()" class="w-10 h-10 bg-white/10 rounded-full hover:bg-white/20 transition">Set</button>
      <button onclick="openModal('login')" class="px-5 py-2 border border-pink-500 rounded-full hover:bg-pink-500 transition text-sm">Login</button>
      <button onclick="openModal('register')" class="px-5 py-2 bg-pink-500 rounded-full hover:bg-pink-600 transition text-sm font-semibold">Daftar</button>
    </div>
  </div>
</nav>

<section class="pt-32 pb-20 px-6 max-w-7xl mx-auto">
  <div class="grid md:grid-cols-2 gap-10 items-center">
    <div>
      <h2 class="text-5xl font-bold leading-tight">Website Resmi<br><span class="text-pink-500">Scarlett III</span></h2>
      <p class="mt-4 text-white/60">Server stabil, event harian, komunitas solid. Login untuk melihat setting akun.</p>
      <div class="mt-8 flex gap-3">
        <button onclick="openModal('register')" class="px-8 py-3 bg-pink-500 rounded-full font-semibold">Mulai Sekarang</button>
        <button onclick="openSettings()" class="px-8 py-3 bg-white/10 rounded-full border border-white/10">Buka Setting</button>
      </div>
      <p id="userInfo" class="mt-6 text-sm text-pink-400"></p>
    </div>
    <div class="bg-gradient-to-br from-pink-500 to-purple-600 p-[1px] rounded-3xl">
      <div class="bg-[#1a1a1a] rounded-3xl p-6">
        <h3 class="font-semibold">Status Server</h3>
        <div class="mt-4 space-y-3 text-sm">
          <div class="flex justify-between"><span>Login Server</span><span class="text-green-400">Online</span></div>
          <div class="flex justify-between"><span>Char Server</span><span class="text-green-400">Online</span></div>
          <div class="flex justify-between"><span>Map Server</span><span class="text-green-400">Online</span></div>
        </div>
      </div>
    </div>
  </div>
</section>

<!-- MODAL LOGIN/REGISTER -->
<div id="modal" class="fixed inset-0 bg-black/70 hidden items-center justify-center z-[100] p-4">
  <div class="bg-white text-black rounded-2xl w-full max-w-md p-8 relative">
    <button onclick="closeModal()" class="absolute top-4 right-4 text-xl">X</button>
    <h3 id="modalTitle" class="text-2xl font-bold mb-6">Login</h3>
    <form onsubmit="handleAuth(event)" class="space-y-4">
      <input id="email" type="text" placeholder="Username" required class="w-full px-4 py-3 rounded-xl border outline-none focus:border-pink-500">
      <input id="password" type="password" placeholder="Password" required class="w-full px-4 py-3 rounded-xl border outline-none focus:border-pink-500">
      <div id="extraField" class="hidden"><input id="confirm" type="password" placeholder="Konfirmasi Password" class="w-full px-4 py-3 rounded-xl border outline-none focus:border-pink-500"></div>
      <button type="submit" class="w-full py-3 bg-pink-500 text-white rounded-xl font-semibold">Submit</button>
    </form>
    <p id="switchText" class="text-center text-sm mt-4 text-gray-500"></p>
  </div>
</div>

<!-- PANEL SETTING -->
<div id="settingsPanel" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-[100] p-4">
  <div class="bg-[#1e1e1e] border border-white/10 rounded-2xl w-full max-w-sm p-6">
    <div class="flex justify-between items-center mb-6">
      <h3 class="text-xl font-bold">Pengaturan</h3>
      <button onclick="closeSettings()" class="w-8 h-8 bg-white/10 rounded-full">X</button>
    </div>
    <div class="space-y-5">
      <div>
        <label class="text-sm text-white/50">Display Name</label>
        <input id="setName" type="text" placeholder="Nama" class="mt-1 w-full px-4 py-2.5 rounded-xl bg-white/10 border border-white/10 outline-none focus:border-pink-500">
      </div>
      <label class="flex justify-between items-center py-2 border-b border-white/5">BGM Musik <input id="bgmToggle" type="checkbox" checked class="w-5 h-5"></label>
      <label class="flex justify-between items-center py-2 border-b border-white/5">Notifikasi Event <input id="notifToggle" type="checkbox" checked class="w-5 h-5"></label>
      <label class="flex justify-between items-center py-2">Mode Hemat <input id="hematToggle" type="checkbox" class="w-5 h-5"></label>
    </div>
    <button onclick="saveSettings()" class="w-full mt-6 py-3 bg-pink-500 rounded-xl font-semibold hover:bg-pink-600">Simpan Setting</button>
    <button onclick="resetSettings()" class="w-full mt-2 py-3 bg-white/10 rounded-xl text-sm text-white/60">Reset Semua</button>
  </div>
</div>

<script>
let mode='login';
const modal=document.getElementById('modal');
const settingsPanel=document.getElementById('settingsPanel');

function openModal(t){
  mode=t;
  modal.classList.remove('hidden'); modal.classList.add('flex');
  document.getElementById('modalTitle').innerText = t==='login'?'Login Akun':'Registrasi Akun';
  document.getElementById('extraField').classList.toggle('hidden', t==='login');
  document.getElementById('switchText').innerHTML = t==='login'
? `Belum punya akun? <span onclick="openModal('register')" class="text-pink-500 cursor-pointer font-bold">Daftar</span>`
  : `Sudah punya akun? <span onclick="openModal('login')" class="text-pink-500 cursor-pointer font-bold">Login</span>`;
}
function closeModal(){ modal.classList.add('hidden'); modal.classList.remove('flex'); }
function handleAuth(e){
  e.preventDefault();
  const u=document.getElementById('email').value;
  const p=document.getElementById('password').value;
  if(mode==='register' && p!==document.getElementById('confirm').value){ alert('Password tidak sama!'); return; }
  localStorage.setItem('scarlett_user',u);
  document.getElementById('userInfo').innerText='Login sebagai: '+u;
  alert(mode==='register'?'Registrasi sukses!':'Login sukses!');
  closeModal();
}
function openSettings(){
  document.getElementById('setName').value = localStorage.getItem('scarlett_name') || localStorage.getItem('scarlett_user') || '';
  document.getElementById('bgmToggle').checked = localStorage.getItem('scarlett_bgm')!=='false';
  document.getElementById('notifToggle').checked = localStorage.getItem('scarlett_notif')!=='false';
  document.getElementById('hematToggle').checked = localStorage.getItem('scarlett_hemat')==='true';
  settingsPanel.classList.remove('hidden'); settingsPanel.classList.add('flex');
}
function closeSettings(){ settingsPanel.classList.add('hidden'); settingsPanel.classList.remove('flex'); }
function saveSettings(){
  localStorage.setItem('scarlett_name', document.getElementById('setName').value);
  localStorage.setItem('scarlett_bgm', document.getElementById('bgmToggle').checked);
  localStorage.setItem('scarlett_notif', document.getElementById('notifToggle').checked);
  localStorage.setItem('scarlett_hemat', document.getElementById('hematToggle').checked);
  document.getElementById('userInfo').innerText='Setting disimpan. Halo, '+ (document.getElementById('setName').value || 'Player') +'!';
  closeSettings();
}
function resetSettings(){
  if(confirm('Reset semua setting?')){ localStorage.clear(); alert('Reset beres!'); closeSettings(); location.reload(); }
}
window.onload=()=>{
  const u=localStorage.getItem('scarlett_user');
  if(u) document.getElementById('userInfo').innerText='Login sebagai: '+u;
}
modal.addEventListener('click', e=>{ if(e.target===modal) closeModal(); });
settingsPanel.addEventListener('click', e=>{ if(e.target===settingsPanel) closeSettings(); });
</script>
</body>
    </html>
